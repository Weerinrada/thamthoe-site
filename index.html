ความเชื่อและธรรมเนียมการสวดของผู้บูชา",why:"สวดด้วยความเคารพและมีสติ",editorialNote:"ต้นฉบับที่ผู้ใช้ให้มาระบุให้เปลี่ยนชื่อองค์นาคตามองค์ที่บูชา เช่น วาสุกรีนาโค อนันตนาโค หรือภุชังคะนาโค หากเป็นนาคเทวีให้ใช้คำว่า ‘นาคะเทวี ศรี…(ชื่อ)… วิสุทธิเทวี’ และหากบูชาโดยไม่เจาะจงให้ใช้ ‘นาคะฤทธิ มะหาเตโช วิสุทธิเทวา’ เครื่องหมาย * ในชื่อศรีสุทโธเป็นจุดสำหรับเปลี่ยนชื่อตามองค์ที่บูชา"},{id:"rahu",title:"คาถาบูชาพระราหู (บทจากสุริยสูตร)",group:"พระสูตร / ปริตร",minutes:6,level:"ปานกลาง",pali:["กินนุ สันตะระมาโน วะ ราหุ สุริยัง","ปะมุญจะสิ สังวิคคะรูโป อาคัมมะ","กินนุภีโต วะ ติฏฐะสีติ สัตตะธา เม","ผะเล มุทธา ชีวันโต นะ สุขัง ละเภ","พุทธะคาถาภิคีโตมหิ โน เจ มุญเจยยะ","สุริยันติ.","กินนุ สันตะระมาโน วะ ราหุ จันทัง","ปะมุญจะสิ สังวิคคะรูโป อาคัมมะ","กินนุภีโต วะ ติฏฐะสิติ สัตตะธา เม","ผะเล มุทธา ชีวันโต นะ สุขัง ละเภ","พุทธะคาถาภิคีโตมหิ โน เจ มุญเจยยะ","จันทิมันติ"],thai:"บทจากเรื่องพระราหูปล่อยพระอาทิตย์และพระจันทร์ในสุริยสูตร",why:"สวดเพื่อระลึกถึงพระพุทธคุณและความไม่ประมาท",editorialNote:"บทนี้เป็นถ้อยคำตอบของพระราหูในเรื่องสุริยสูตร ไม่ใช่พระพุทธดำรัสสั่งให้บูชาพระราหู"},{id:"ngernlan",title:"พระคาถาเงินล้าน",group:"โชคลาภ",minutes:6,level:"ปานกลาง",pali:["สัมปะจิตฉามิ นาสังสิโม","พรหมา จะ มะหาเทวา สัพเพ ยักขา ปะรายันติ","พรหมา จะ มะหาเทวา อะภิลาภา ภะวันตุ เม","มะหาปุญโญ มะหาลาโภ ภะวันตุ เม","มิเตภาหุหะติ","พุทธะมะอะอุ นะโมพุทธายะ วิระทะโย วิระโคนายัง วิระหิงสา","วิระทาสี วิระทาสา วิระอิตถิโย พุทธัสสะ มานีมามะ","พุทธัสสะ สวาโหม","สัมปะติจฉามิ เพ็งเพ็ง พาพา หาหา ฤาฤา"],thai:"บทสวดที่นิยมสวดเพื่อเป็นสิริมงคลด้านการงานและการเงิน ขอให้มีความคล่องตัวในการประกอบอาชีพสุจริต มีลาภจากการทำงานที่ซื่อสัตย์",why:"สวดควบคู่กับความขยันและความซื่อสัตย์"},{id:"maha",title:"พระคาถามหาจักรพรรดิ",group:"บูชา",minutes:5,level:"ปานกลาง",pali:["นะโม พุทธายะ พระพุทธะ ไตรรัตนญาณ","มณีนพรัตน์ สีสะหัสสะ สุธรรมา","พุทโธ ธัมโม สังโฆ ยะธาพุทโมนะ","พุทธะบูชา ธัมมะบูชา สังฆะบูชา","อัคคีทานัง วะรังคันธัง สีวลี จะมะหาเถรัง","อะหังวันทามิ ทูระโต","อะหังวันทามิ ธาตุโย","อะหังวันทามิ สัพพะโส","พุทธะ ธัมมะ สังฆะ ปูเชมิ"],thai:"บทสวดบูชาพระรัตนตรัยตามรูปแบบคาถามหาจักรพรรดิ",why:"สวดช้า ๆ ให้ใจอยู่กับบทสวด",editorialNote:"แสดงตามข้อความ 9 วรรคที่ผู้ใช้ส่งให้ โดยไม่เติมบทต่อหรือทำซ้ำส่วนต้น"},{id:"sappe",title:"บทสวดสัพเพ",group:"คุ้มครองใจ",minutes:3,level:"ง่าย",pali:["สัพเพ พุทธา, สัพเพ ธัมมา, สัพเพ สังฆา","พะลัปปัตตา ปัจเจกานัญจะ","ยัง พะลัง อะระหันตานัญจะ เตเชนะ","รักขัง พันธามิ สัพพะโส","พุทธัง อะธิฏฐามิ ธัมมัง อะธิฏฐามิ","สังฆัง อะธิฏฐามิ."],thai:"บทสวดอธิษฐานระลึกถึงกำลังแห่งพระพุทธ พระธรรม และพระสงฆ์",why:"สวดด้วยใจสงบและตั้งมั่นในพระรัตนตรัย",editorialNote:"จัดเก็บตามข้อความที่ผู้ใช้ส่งมา ยังไม่ได้เพิ่มคำแปลหรือปรับรูปสะกด"},{id:"suntaree",title:"คาถาบูชาพระสุนทรีวาณี",group:"บูชา",minutes:5,level:"ง่าย",pali:["มุนินทะ วะทะนัมพุชะ คัพภะสัมภะวะ สุนทะรี","ปาณีนัง สะระณัง วาณี มัยหัง ปิณะยะตัง มะนัง","สุนทรีวาณี เทวี สัพพะสิทธิง ภะวันตุ เม"],thai:"ขอนอบน้อมบูชาพระสุนทรีวาณี เทวีแห่งปัญญาและวาจาอันไพเราะ ขอให้มีสติ ปัญญา และใช้วาจาด้วยความเมตตา",why:"บูชาด้วยความเคารพเพื่อปัญญาและวาจาดี"},{id:"ahosi",title:"บทอธิษฐานขออโหสิกรรม",group:"ขอขมากรรม",minutes:7,level:"ปานกลาง",pali:["กายะกัมมัง วะจีกัมมัง มะโนกัมมัง สัญจิจจะกัมมัง อะสัญจิจจะกัมมัง ขะมันตุ เม อะโหสิกัมมัง ภะวะตุ เม."],thai:"บทอธิษฐานขออโหสิกรรมและให้อภัยแก่กัน",translation:"กรรมใดๆ ไม่ว่าจะเป็นกายกรรม วจีกรรม มโนกรรม ที่ข้าพเจ้าได้ทำล่วงเกินแก่ผู้ใด ทั้งโดยตั้งใจก็ดี ไม่ได้ตั้งใจก็ดี ในภพชาติใดก็ตาม ขอให้เจ้ากรรมนายเวรทั้งหลาย จงโปรดยกโทษให้เป็นอโหสิกรรมแก่ข้าพเจ้า อย่าได้จองเวรจองกรรมต่อกันอีกเลย\nแม้แต่กรรมใดที่ใครๆ ทำแก่ข้าพเจ้าก็ตาม ข้าพเจ้าขออโหสิกรรมให้ทั้งสิ้น ยกถวายพระพุทธเจ้าเป็นอภัยทาน ขอจงดลใจให้เขาเหล่านั้นกลับมีเมตตาจิต คิดเป็นมิตรกับข้าพเจ้า เพื่อจะได้ไม่มีเวรกรรมต่อกันตลอดไป\nด้วยอานิสงส์แห่งอภัยทานนี้ ขอให้ข้าพเจ้าพร้อมทั้งครอบครัว ตลอดจนวงศาคณาญาติ ผู้มีอุปการคุณของข้าพเจ้า พ้นจากความทุกข์ยากลำบากเบ็ญใจความทุกข์อย่าได้ใกล้ ความเจ็บไข้อย่าได้มี ขอให้มีความสุขสวัสดีมีชัย เสนียดจัญไรและอุปัทวันตรายทั้งหลาย จงเสื่อมสิ้นหายไป นึกคิดปรารถนาสิ่งใด ที่เป็นไปโดยชอบประกอบด้วยธรรมแล้ว ขอให้สิ่งนั้นจงพล ครูผู้สอนของเทวดาและมนุษย์ทั้งหลาย เป็นผู้รู้ ผู้ตื่น ผู้เบิกบานด้วยธรรม เป็นผู้มีความจำเริญ จำแนกธรรมสั่งสอนสัตว์"},"bahung":{"pali":["พาหุง สะหัสสะมะภินิมมิตะสาวุธันตัง","ครีเมขะลัง อุทิตะโฆระสะเสนะมารัง","ทานาทิธัมมะวิธินา ชิตะวา มุนินโท","ตันเตชะสา ภะวะตุ เต ชะยะมังคะลานิ","มาราติเรกะมะภิยุชฌิตะสัพพะรัตติง","โฆรัมปะนาฬะวะกะมักขะมะถัทธะยักขัง","ขันตีสุทันตะวิธินา ชิตะวา มุนินโท","ตันเตชะสา ภะวะตุ เต ชะยะมังคะลานิ","นาฬาคิริง คะชะวะรัง อะติมัตตะภูตัง","ทาวัคคิจักกะมะสะนีวะ สุทารุณันตัง","เมตตัมพุเสกะวิธินา ชิตะวา มุนินโท","ตันเตชะสา ภะวะตุ เต ชะยะมังคะลานิ","อุกขิตตะขัคคะมะติหัตถะสุทารุณันตัง","ธาวันติโย ชะนะปะถังคุลิมาละวันตัง","อิทธีภิสังขะตะมะโน ชิตะวา มุนินโท","ตันเตชะสา ภะวะตุ เต ชะยะมังคะลานิ","กัตตวานะ กัฏฐะมุทะรัง อิวะ คัพภินียา","จิญจายะ ทุฎฐะวะจะนัง ชะนะกายะมัชเฌ สันเตนะ โสมะวิธินา ชิตะวา มุนินโท","ตันเตชะสา ภะวะตุ เต ชะยะมังคะลานิ","สัจจัง วิหายะ มะติสัจจะกะวาทะเกตุง","วาทาภิโรปิตะมะนัง อะติอันธะภูตัง","ปัญญาปะทีปะชะลิโต ชิตะวา มุนินโท","ตันเตชะสา ภะวะตุ เต ชะยะมังคะลานิ","นันโทปะนันทะภุชะคัง วิพุธัง มะหิทธิง","ปุตเตนะ เถระภุชะเคนะ ทะมาปะยันโต อิทธูปะเทสะวิธินา ชิตะวา มุนินโท","ตันเตชะสา ภะวะตุ เต ชะยะมังคะลานิ","ทุคคาหะ ทิฏฐิภุชะเคนะ สุทัฏฐะหัตถัง","พรัหมัง วิสุทธิชุติมิทธิพะกาภิธานัง","ญาณาคะเทนะ วิธินา ชิตะวา มุนินโท","ตันเตชะสา ภะวะตุ เต ชะยะมังคะลานิ"],"translation":"พระจอมมุนีทรงชนะพญามาร ผู้นิรมิตแขน ๑,๐๐๐ ถืออาวุธครบมือ ขี่ช้างคิริเมขล์ มาพร้อมเสนามารผู้ร้องลั่น ด้วยวิธีแห่งธรรม คือทานบารมีเป็นต้น ด้วยเดชนั้น ขอชัยมงคลทั้งหลายจงมีแก่ท่าน \nพระจอมมุนีทรงชนะอาฬวกยักษ์ ผู้ดุร้าย แข็งกระด้าง ใจอำมหิตยิ่งกว่ามาร ผู้สู้รบตลอดทั้งคืน ด้วยวิธีแห่งขันติและการทรมานอย่างนุ่มนวล ด้วยเดชนั้น ขอชัยมงคลทั้งหลายจงมีแก่ท่าน \nพระจอมมุนีทรงชนะช้างนาฬาคิรี อันประเสริฐ ผู้ตกมัน ดุร้ายดุจไฟป่า จักรอาวุธ และอสุนีบาต ด้วยวิธีรดด้วยน้ำเมตตา ด้วยเดชนั้น ขอชัยมงคลทั้งหลายจงมีแก่ท่าน \nพระจอมมุนีทรงชนะโจรองคุลีมาล ผู้ถือดาบเงื้อง่า ดุร้ายยิ่ง วิ่งไล่ตามตลอดทาง ๓ โยชน์ ด้วยวิธีกระทำฤทธิ์ทางใจ ด้วยเดชนั้น ขอชัยมงคลทั้งหลายจงมีแก่ท่าน \nพระจอมมุนีทรงชนะคำใส่ร้ายของนางจิญจมาณวิกา ผู้ทำท่อนไม้ผูกท้องอย่างหญิงมีครรภ์ (มาประจานพระองค์) ท่ามกลางหมู่ชน ด้วยวิธีแห่งความสงบและกริยาดุจจันทร์ ด้วยเดชนั้น ขอชัยมงคลทั้งหลายจงมีแก่ท่าน \nพระจอมมุนีผู้ทรงรุ่งโรจน์ด้วยประทีปแห่งปัญญา ทรงชนะสัจจกนิครนถ์ ผู้ละสัจจะ ตั้งใจในการชนะวาทะ (ในการโต้วาที) จิตมืดบอด ผู้เป็นธงชัยแห่งวาทกะ ด้วยเดชนั้น ขอชัยมงคลทั้งหลายจงมีแก่ท่าน \nพระจอมมุนีทรงชนะพญานาคนันโทปนันทะ ผู้มีฤทธิ์มาก ผู้บัณฑิต ด้วยการให้พุทธบุตร (พระโมคคัลลานเถระ) ผู้เป็นนาคในเพศพระภิกษุ ไปทรมาน ด้วยวิธีอันเป็นคำสั่งสอนทางฤทธิ์ ด้วยเดชนั้น ขอชัยมงคลทั้งหลายจงมีแก่ท่าน \nพระจอมมุนีทรงชนะพรหมชื่อพกะ ผู้ทรงรัศมีบริสุทธิ์ ผู้มีฤทธิ์ ผู้มีมือถูกงูคือทิฏฐิที่ยึดถือผิด กัดแล้วอย่างแน่นแฟ้น ด้วยวิธีแห่งโอสถคือพระญาณ ด้วยเดชนั้น ขอชัยมงคลทั้งหลายจงมีแก่ท่าน"},"chin":{"pali":["ปุตตะกาโม ละเภ ปุตตัง ธะนะกาโม ละเภ ธะนัง",
"อัตถิ กาเย กายะญายะ เทวานัง ปิยะตัง สุตวา","อิติปิ โส ภะคะวา ยะมะราชาโน ท้าวเวสสุวัณโณ","มะระณัง สุขัง อะระหัง สุคะโต นะโมพุทธายะ ฯ","ชะยาสะนากะตา พุทธา เชตะวา มารัง สะวาหะนัง","จะตุสัจจาสะภัง ระสัง เย ปิวงสุ นะราสะภา","ตัณหังกะราทะโย พุทธา อัฏฐะวีสะติ นายะกา สัพเพ ปะติฏฐิตา มัยหัง มัตถะเก เต มุนิสสะรา","สีเส ปะติฏฐิโต มัยหัง พุทโธ ธัมโม ทะวิโลจะเน สังโฆ ปะติฏฐิโต มัยหัง อุเร สัพพะคุณากะโร","หะทะเย เม อะนุรุทโธ สารีปุตโต จะทักขิเณ โกณฑัญโญ ปิฏฐิภาคัสมิง โมคคัลลาโน จะ วามะเก ทักขิเณ สะวะเน มัยหัง อาสุง อานันทะราหุลา กัสสะโป จะ มะหานาโม อุภาสุง วามะโสตะเก เกสะเต ปิฏฐิภาคัสมิง สุริโย วะ ปะภังกะโร นิสินโน สิริสัมปันโน โสภิโต มุนิปุงคะโว","กุมาระกัสสะโป เถโร มะเหสี จิตตะวาทะโก โส มัยหัง วะทะเน นิจจัง ปะติฏฐาสิ คุณากะโร","ปุณโณ อังคุลิมาโล จะอุปาลีนันทะสีวะลี เถรา ปัญจะ อิเม ชาตา นะลาเฏ ติละกา มะมะ","เสสาสีติ มะหาเถรา วิชิตา ชินะสาวะกา เอตาสีติ มะหาเถรา ชิตะวันโต ชิโนระสา ชะลันตา สีละเตเชนะ อังคะมังเคสุ สัณฐิตา","ระตะนัง ปุระโต อาสิ ทักขิเณ เมตตะสุตตะกัง ธะชัคคัง ปัจฉะโต อาสิ วาเม อังคุลิมาละกัง","ขันธะโมระปะริตตัญจะ อาฏานาฏิยะสุตตะกัง อากาเส ฉะทะนัง อาสิ เสสา ปาการะสัณฐิตา","ชินาณาวะระสังยุตตา สัตตัปการะลังกะตา วาตะปิตตาทิสัญชาตา พาหิรัชฌัตตุปัททะวา","อะเสสา วินะยัง ยันตุ อะนันตะชินะเตชะสา วะสะโต เม สะกิจเจนะ สะทา สัมพุทธะปัญชะเร","ชินะปัญชะระมัชฌัมหิ วิหะรันตัง มะหีตะเล สะทา ปาเลนตุ มัง สัพเพ เต มะหาปุริสาสะภา","อิจเจวะมันโต สุคุตโต สุรักโข ชินานุภาเวนะ ชิตุปัททะโว ธัมมานุภาเวนะ ชิตาริสังโฆ สังฆานุภาเวนะ ชิตันตะราโย สัทธัมมานุภาวะปาลิโต จะรามิ ชินะปัญชะเรติ"],"translation":"ผู้ปรารถนาบุตร ย่อมได้บุตร ผู้ปรารถนาทรัพย์ ย่อมได้ทรัพย์ ขอให้มีญาณรู้แจ้งในกาย (รู้คุณวิเศษในร่างกายของตน) ได้สดับมาว่า (ผู้สวดบทนี้) ย่อมเป็นที่รักของทวยเทพทั้งหลาย แม้เพราะอย่างนี้ พระผู้มีพระภาคเจ้าพระองค์นั้น (ทรงมีพระคุณ) พระยมราช ท้าวเวสสุวรรณ (ขอจงคุ้มครอง) แม้ความตายก็เป็นสุข ขอนอบน้อมแด่พระอรหันต์ พระสุคต ขอนอบน้อมแด่พระพุทธเจ้า\nพระพุทธเจ้าทั้งหลาย ผู้เป็นจอมแห่งนรชน (นะราสะภา) เสด็จประทับนั่งเหนือชัยบัลลังก์ (ชะยาสะนา) ทรงปราบพญามารพร้อมทั้งเสนาพาหนะแล้ว ทรงดื่มรสอันประเสริฐแห่งอริยสัจ ๔ \nพระพุทธเจ้าทั้งหลาย ๒๘ พระองค์ มีพระพุทธเจ้าทรงพระนามว่า ตัณหังกร เป็นต้น ผู้เป็นจอมมุนีและผู้นำสรรพสัตว์ ขอจงประดิษฐานบนกระหม่อม (มัตถะเก) ของข้าพเจ้าทุก ๆ พระองค์ \nพระพุทธเจ้า ประดิษฐานอยู่ที่ศีรษะของข้าพเจ้า พระธรรม ประดิษฐานอยู่ที่ดวงตาทั้งสองของข้าพเจ้า พระสงฆ์ ผู้เป็นบ่อเกิดแห่งคุณทั้งปวง ประดิษฐานอยู่ที่อก (หทัย) ของข้าพเจ้า \nพระอนุรุทธะ ประดิษฐานอยู่ที่ดวงใจของข้าพเจ้า พระสารีบุตร ประดิษฐานอยู่ที่เบื้องขวา พระอัญญาโกณฑัญญะ ประดิษฐานอยู่ที่เบื้องหลัง และพระโมคคัลลานะ ประดิษฐานอยู่ที่เบื้องซ้าย \nพระอานนท์ และพระราหุล ประดิษฐานอยู่ที่หูเบื้องขวาของข้าพเจ้า พระมหากัสสปะ และพระมหานามะ ทั้งสองรูป ประดิษฐานอยู่ที่หูเบื้องซ้าย \nพระโสภิตเถระ ผู้เป็นจอมมุนีอันประเสริฐ สมบูรณ์ด้วยศิริ (สง่างาม) รุ่งโรจน์เหมือนดวงอาทิตย์ส่องแสง ประทับนั่งอยู่ที่ปลายผมด้านหลัง\nพระกุมารกัสสปเถระ ผู้แสวงหาคุณอันยิ่งใหญ่ (มะเหสี) ผู้เป็นเลิศในการกล่าวธรรมอันวิจิตร (จิตตะวาทะโก) เป็นบ่อเกิดแห่งคุณ ขอจงประดิษฐาน ณ ปากของข้าพเจ้าเป็นนิจ\nพระเถระทั้ง ๕ รูปนี้ คือ พระปุณณะ พระองคุลิมาล พระอุบาลี พระนันทะ และพระสีวลี เกิดเป็นดิลก (รอยเจิมแห่งมงคล) ที่หน้าผากของข้าพเจ้า \nพระมหาเถระ (ผู้เป็นพระอสีติมหาสาวก) ที่เหลืออีก ๘๐ รูป ผู้ชนะกิเลสแล้ว เป็นสาวกของพระชินสีห์ พระมหาเถระ ๘๐ รูปเหล่านี้ ผู้ทรงชัยชนะ เป็นเสมือนโอรสของพระชินะ รุ่งเรืองด้วยเดชแห่งศีล ขอจงประดิษฐานอยู่ทั่วทุกส่วนของอวัยวะของข้าพเจ้า\nขอรัตนสูตร จงเป็นเกราะคุ้มกันเบื้องหน้า เมตตสูตร จงคุ้มเบื้องขวา ธชัคคสูตร จงคุ้มเบื้องหลัง และอังคุลิมาลปริตร จงคุ้มเบื้องซ้าย\nขันธปริตร โมรปริตร และอาฏานาฏิยสูตร จงเป็นหลังคาคลุมในอากาศ พระสูตร (พระปริตร) อื่น ๆ ที่เหลือ จงเป็นกำแพงล้อมรอบ \n(พระชินบัญชรนี้) ประกอบไปด้วยพระชินเจ้าทั้งหลาย อันประเสริฐต่าง ๆ ประดับด้วยกำแพง ๗ ชั้น (สัตตัปปาการะลังกะตา) ขอบรรดาอุปัทวันตรายทั้งปวง ทั้งภายนอกและภายใน ที่เกิดจากลม น้ำดี และอื่น ๆ (จงพินาศไปสิ้น — เนื้อหาต่อในคาถาที่ ๑๓) \nขอบรรดาอุปัทวันตรายเหล่านั้น (ที่กล่าวในคาถาที่ ๑๒) จงพินาศไปไม่มีเหลือ ด้วยเดชแห่งพระชินเจ้าผู้หาที่สุดมิได้ (อะนันตะชินะเตชะ) ขอข้าพเจ้าผู้อยู่ในกรง (ปัญชระ) ของพระสัมพุทธเจ้าทุกเมื่อ จงดำเนินกิจของตน (อย่างปกติสุข) \nขอพระมหาบุรุษทั้งหลายผู้ประเสริฐ (ผู้เป็นจอมแห่งบุรุษ — มหาปุริสาสะภา) เหล่านั้นทั้งสิ้น จงคุ้มครองข้าพเจ้า ผู้อยู่ในท่ามกลางพระชินบัญชร ผู้อยู่บนพื้นปฐพีนี้ ตลอดกาลทุกเมื่อ\nด้วยอาการอย่างนี้ ข้าพเจ้าเป็นผู้ได้รับการคุ้มครองรักษาเป็นอย่างดี ทั้งภายในและภายนอก ชนะอุปัทวันตรายทั้งหลาย ด้วยอานุภาพของพระชินะ ชนะหมู่ข้าศึก ด้วยอานุภาพของพระธรรม ชนะอันตรายทั้งปวง ด้วยอานุภาพของพระสงฆ์ อันพระสัทธรรมคุ้มครองรักษาแล้ว ขอท่องเที่ยวอยู่ในชินบัญชร ตลอดไปเทอญ"},"metta":{"pali":["สัพเพ สัตตา","อะเวรา โหนตุ","อัพยาปัชฌา โหนตุ","อะนีฆา โหนตุ","สุขี อัตตานัง ปะริหะรันตุ"],"translation":"สัตว์ทั้งหลายที่เป็นเพื่อนทุกข์ เกิด แก่ เจ็บ ตาย ด้วยกันทั้งหมดทั้งสิ้น จงเป็นสุขเป็นสุขเถิด อย่าได้มีเวรแก่กันและกันเลย จงเป็นสุขเป็นสุขเถิด อย่าได้เบียดเบียนซึ่งกันและกันเลย จงเป็นสุขเป็นสุขเถิด อย่าได้มีความทุกข์กายทุกข์ใจเลย จงมีความสุขกาย สุขใจ รักษาตนให้พ้นจากทุกข์ภัยทั้งสิ้นเถิด"},"kruad":{"pali":["อิทัง เม ญาตีนัง โหตุ สุขิตา โหนตุ ญาตะโย","อิมินา ปุญญะกัมเมนะ อุปัชชะยา จะ เม มาตา ปิตา จะ ญาตะกา สุขิตา โหนตุ เม สัพเพ"],"translation":"ขอส่วนบุญนี้ จงสำเร็จแก่ญาติทั้งหลายของข้าพเจ้า ขอญาติทั้งหลายนั้น จงมีความสุข ด้วยบุญกุศลนี้ ขอให้ครูอุปัชฌาย์ มารดา บิดา และญาติทั้งหลาย จงเป็นผู้มีความสุข"},"chai":{"pali":["มหาการุณิโก นาโถ","หิตายะ สัพพะปาณินัง","ปูเรตวา ปาระมี สัพพา","ปัตโต สัมโพธิมุตตะมัง","เอเตนะ สัจจะวัชเชนะ","โหตุ เม ชะยะมังคะลัง","ชะยันโต โพธิยา มูเล","สักยานัง นันทิวัฑฒะโน","เอวัง อะหง วิชะโย โหมิ","ชะยัสสุ ชะยะมังคะเล","อะปะราชิตะปัลลังเก","สีเส ปะฐะวิโปกขะเร","อะภิเสเก สัพพะพุทธานัง","อัคคัปปัตโต ปะโมทะติ","สุนักขัตตัง สุมังคะลัง","สุปะภาตัง สุหุฏฐิตัง","สุขะโณ สุมุหุตโต จะ","สุยิฏฐัง พรัหมะจาริสุ","ปะทักขิณัง กายะกัมมัง","วาจากัมมัง ปะทักขิณัง","ปะทักขิณัง มะโนกัมมัง","ปะณิธีเต ปะทักขิณา","ปะทักขิณานิ กัตวานะ","ละภันตัตเถ ปะทักขิเณ","ภะวะตุ สัพพะมังคะลัง","รักขันตุ สัพพะเทวะตา","สัพพะพุทธานุภาเวนะ","สะทา โสตถี ภะวันตุ เต","ภะวะตุ สัพพะมังคะลัง","รักขันตุ สัพพะเทวะตา","สัพพะธัมมานุภาเวนะ","สะทา โสตถี ภะวันตุ เต","ภะวะตุ สัพพะมังคะลัง","รักขันตุ สัพพะเทวะตา","สัพพะสังฆานุภาเวนะ","สะทา โสตถี ภะวันตุ เต"],"translation":"พระผู้เป็นที่พึ่ง (พระพุทธเจ้า) ผู้ทรงพระมหากรุณา ทรงบำเพ็ญบารมีทั้งปวง เพื่อประโยชน์แก่สรรพสัตว์ ทรงบรรลุพระสัมโพธิญาณอันอุดม — ด้วยคำสัจจ์นี้ ขอชัยมงคลจงมีแก่ท่าน \nขอท่านจงมีชัยชนะดังเช่นพระผู้ทรงชนะ ณ ควงไม้โพธิ์ ผู้ทรงทำให้ศากยวงศ์เพิ่มพูนความยินดี — ขอท่านจงชนะในชัยมงคล (เหมือนพระองค์) บนบัลลังก์อันไม่พ่ายแพ้ บนหน้าแผ่นดินดุจดอกบัว ในที่อภิเษกของพระพุทธเจ้าทั้งปวง — พระองค์ทรงถึงความเป็นเลิศ ทรงบันเทิงพระทัย \n(เมื่อสัตว์ทั้งหลายประพฤติชอบ) ฤกษ์ก็เป็นฤกษ์ดี มงคลก็เป็นมงคลดี รุ่งอรุณก็เป็นรุ่งอรุณดี ตื่นนอนก็ตื่นนอนดี ขณะก็เป็นขณะดี ครู่ก็เป็นครู่ดี และทักษิณาที่ถวายในผู้ประพฤติพรหมจรรย์ก็เป็นการถวายดี กายกรรมก็เป็นปทักษิณ (การกระทำที่เวียนไปทางขวา = เป็นมงคล) วจีกรรมก็เป็นปทักษิณ มโนกรรมก็เป็นปทักษิณ ความตั้งใจของท่านก็เป็นปทักษิณ — เหล่าสัตว์เมื่อกระทำสิ่งที่เป็นปทักษิณแล้ว ย่อมได้ผลที่เป็นปทักษิณ (ผลดี) \nขอสรรพมงคลจงมี ขอเทวดาทั้งปวงจงรักษา ด้วยอานุภาพแห่งพระพุทธเจ้าทั้งปวง ขอความสวัสดีจงมีแก่ท่าน ตลอดกาลทุกเมื่อ / ขอสรรพมงคลจงมี ขอเทวดาทั้งปวงจงรักษา ด้วยอานุภาพแห่งพระธรรมทั้งปวง ขอความสวัสดีจงมีแก่ท่าน ตลอดกาลทุกเมื่อ / ขอสรรพมงคลจงมี ขอเทวดาทั้งปวงจงรักษา ด้วยอานุภาพแห่งพระสงฆ์ทั้งปวง ขอความสวัสดีจงมีแก่ท่าน ตลอดกาลทุกเมื่อ"},"metta-self":{"translation":"ขอให้ข้าพเจ้ามีความสุข ปราศจากความทุกข์ ไม่มีเวร ไม่เบียดเบียนใคร ปราศจากความทุกข์กายใจ และดูแลตนเองให้พ้นภัย"},"wessuwan":{"translation":"แม้ด้วยเหตุนี้ พระผู้มีพระภาคเจ้าพระองค์นั้น (ผู้ทรงห่างไกลจากกิเลส ควรค่าแก่การบูชา) ได้ตรัสรับรองไว้ว่า พญายมราชมีจริง ท้าวเวสสุวรรณมีจริง ความตายมีจริง และความสุขก็มีจริง ข้าพเจ้าผู้ดำเนินไปดีแล้ว ขอนอบน้อมแด่พระพุทธเจ้า \n ท้าวเวสสุวรรณ ผู้สถิตเป็นใหญ่ในสวรรค์ชั้นจาตุมหาราชิกา เจ้าแห่งหมู่ยักษ์ ผู้เพียบพร้อมด้วยสิริมงคลและปัญญาอันไพศาล (เวสสะ พุสะ — อักขระศักดิ์สิทธิ์) ขอนอบน้อมแด่พระพุทธเจ้า พระอรหันต์ พระผู้ตื่นรู้ ข้าแต่ท้าวเวสสุวรรณ ข้าพเจ้าขอนอบน้อมแด่พระพุทธเจ้า"}};for (const [id, data] of Object.entries(__chantUpdates)) { const item = et.find(x => x.id === id); if (item) Object.assign(item, data); }

,"มัชฌิมา รัสสะกา อะณุกะถูลา","ทิฏฐา วา เยวะ อะทิฏฐา วา","เย จะ ทูเร วะสันติ อะวิทูเร","ภูตา วา สัมภะเวสี วา","สัพเพ สัตตา ภะวันตุ สุขิตัตตา","นะ ปะโร ปะรัง นิกุพเพถะ","นาติมัญเญถะ กัตถะจิ นัง กิญจิ","พยาโรสะนา ปะฏีฆะสัญญา","นาญญะมัญญัสสะ ทุกขะมิจเฉยยะ","มาตา ยะถา นิยัง ปุตตัง","อายุสา เอกะปุตตะมะนุรักเข","เอวัมปิ สัพพะภูเตสุ","มานะสัง ภาวะเย อะปะริมาณัง","เมตตัญจะ สัพพะโลกัสมิง","มานะสัง ภาวะเย อะปะริมาณัง","อุทธัง อะโธ จะ ติริยัญจะ","อะสัมพาธัง อะเวรัง อะสะปัตตัง","ติฏฐัญจะรัง นิสินโน วา","สะยาโน วา ยาวะตัสสะ วิคะตะมิทโธ","เอตัง สะติง อะธิฏเฐยยะ","พรัหมะเมตัง วิหารัง อิธะมาหุ","ทิฏฐิญจะ อะนุปะคัมมะ","สีละวา ทัสสะเนนะ สัมปันโน","กาเมสุ วิเนยยะ เคธัง","นะ หิ ชาตุ คัพภะเสยยัง ปุนะเรตีติ"],"translation":"กิจอันภิกษุ (ผู้บำเพ็ญสมณธรรมอยู่ในป่า) ผู้ฉลาดในประโยชน์ ใคร่จะบรรลุสันตบทอยู่เสมอพึงกระทำก็คือ พึงเป็นผู้อาจหาญ เป็นคนตรง และเป็นคนซื่อ เป็นผู้ว่าง่าย อ่อนโยน และไม่เย่อหยิ๋ง เป็นผู้สันโดษ เป็นผู้เลี้ยงง่าย เป็นผู้มีกิจน้อย มีความประพฤติเบาพร้อม (คือ ไม่สะสม) มีอินทรีย์อันสงบระงับ มีปัญญารักษาตน เป็นผู้ไม่คะนอง เป็นผู้ไม่พัวพันกับชาวบ้าน ไม่พึงประพฤติในสิ่งที่เลวทรามใด ๆ ที่เป็นเหตุให้คนอื่น ซึ่งเป็นผู้รู้ติดเตียนเอาได้ จงเจริญเมตตาจิตว่า ขอสัตว์ทั้งปวง จงเป็นผู้มีความสุขกายสุขใจ มีแต่ความเกษมสำราญเถิด สัตว์มีชีวิตทั้งหลาย ทุกเหล่าหมดบรรดามีที่เป็นประเภทเคลื่อนไหวได้ก็ดี ประเภทอยู่กับที่ก็ดี เป็นสัตว์มีขนาดลำตัวขาว ปานกลางหรือสั้นก็ดี เป็นสัตว์มีลำตัวใหญ่ ปานกลางหรือเล็กก็ดี เป็นชนิดมีลำตัวละเอียดหรือมีลำตัวหยาบก็ดี เป็นจำพวกที่ได้เห็นแล้วหรือไม่ได้เห็นก็ดี เป็นผู้อยู่ในที่ไกล หรือในที่ใกล้ก็ดี เป็นผู้ที่เกิดแล้ว หรือกำลังแสวงหาที่เกิดอยู่ก็ดี ขอสัตว์ทั้งปวงนั้น จงเป็นผู้มีความสุขกายสุขใจเถิด บุคคลไม่พึงข่มเหงกัน ไม่พึงดูหมิ่นเหยียดหยามกัน ไม่ว่าในที่ไหน ๆ ไม่พึงคิดก่อทุกข์ให้แก่กันและกัน เพราะความโกรธ และเพราะความคุมแค้น มารดาถนอมบุตรคนเดียว ผู้เกิดในตนด้วยการยอมสละชีวิตของตนแทนฉันใด พึงเจริญเมตตาจิตอันกว้างใหญ่ อันหาประมาณมิได้ในสัตว์ทั้งปวด แม้ฉันนั้นเถอด พึงเจริญเมตตาจิตอันกว้างใหญ่ อันหาขอบเขตมิได้ อันไม่มีเวร ไม่มีศัตรูคู่ภัยไปในสัตว์โลกทั้งสิ้น ทั้งในทิศเบื้องบน ในทิศเบื้องต่ำ และในทิศขวาง ผู้เจริญเมตตาจิตอย่างนี้นั้น ปรารถนาจะตั้งสติในเมตตา ฌานให้นานเพียงใด ผู้นั้นจะอยู่ในอิริยาบถ บืน เดิน นั่ง หรือนอนก็ตาม พึงเป็นผู้ปราศจากความท้อแท้ ก็ตั้งสติเว้เพียงนั้น บัณฑิตทั้งหลาย กล่าวเมตตาวิทหารธรรมนี้ว่า เป็นพรหมวิหารในพระศาสนานี้ บุคคลผู้นั้นละความเห็นผิด คือ สักกายทิฐิ เสียได้ เป็นผู้มีศีลถึงพร้อมแล้วด้วยญาณทัสนะ (คือ การเห็นอริยสัจ 4 ด้วยญาณ ซึ่งเป็นองค์โสดาปัตติมรรค) สามารถกำจัดความยินดีในกามทั้งหลายเสียได้ (ด้วยอนาคามิมรรค) ย่อมไม่ถึงซึ่งการนอนในครรภ์อีกโดแท้ทีเดียวและ (คือ ไม่กลับมาเกิดอีก)","sourceUrl":"https://84000.org/pray/karaniya-metta-sutta.html","why":"พระสูตรว่าด้วยการดำเนินชีวิตและเจริญเมตตา"},{"id":"mangala-sutta","title":"มงคลสูตร","group":"พระสูตร / ปริตร","minutes":10,"level":"ปานกลาง","pali":["เอวัมเม สุตัง","เอกัง สะมะยัง ภะคะวา สาวัตถิยัง วิหะระติ เชตะวะเน อะนาถะปิณฑิกัสสะ อาราเม","อะถะโข อัญญะตะรา เทวะตา อะภิกกันตายะ รัตติยา อะภิกกันตะวัณณา เกวะละกัปปัง เชตะวะนัง โอภาเสตวา เยนะ ภะคะวา เตนุปะสังกะมิ อุปะสังกะมิตวา ภะควันตัง อะภิวาเทตวา เอกะมันตัง อัฏฐาสิ","เอกะมันตัง ฐิตา โข สา เทวะตา ภะคะวันตัง คาถายะ อัชฌะภาสิ","พะหู เทวา มะนุสสา จะ มังคะลานิ อะจินตะยุง อากังขะมานา โสตถานัง พรูหิ มังคะละมุตตะมัง","อะเสวะนา จะ พาลานัง ปัณฑิตานัญจะ เสวะนา ปูชา จะ ปูชะนียานัง เอตัมมังคะละมุตตะมัง","ปะฏิรูปะเทสะวาโส จะ ปุพเพ จะ กะตะปุญญะตา อัตตะสัมมาปะณิธิ จะ เอตัมมังคะละมุตตะมัง","พาหุสัจจัญจะ สิปปัญจะ วินะโย จะ สุสิกขิโต สุภาสิตา จะ ยา วาจา เอตัมมังคะละมุตตะมัง","มาตาปิตุอุปัฏฐานัง ปุตตะทารัสสะ สังคะโห อะนากุลา จะ กัมมันตา เอตัมมังคะละมุตตะมัง","ทานัญจะ ธัมมะจะริยา จะ ญาตะกานัญจะ สังคะโห อะนะวัชชานิ กัมมานิ เอตัมมังคะละมุตตะมัง","อาระตี วิระตี ปาปา มัชชะปานา จะ สัญญะโม อัปปะมาโท จะ ธัมเมสุ เอตัมมังคะละมุตตะมัง","คาระโว จะ นิวาโต จะ สันตุฏฐี จะ กะตัญญุตา กาเลนะ ธัมมัสสะวะนัง เอตัมมังคะละมุตตะมัง","ขันตี จะ โสวะจัสสะตา สะมะณานัญจะ ทัสสะนัง กาเลนะ ธัมมะสากัจฉา เอตัมมังคะละมุตตะมัง","ตะโป จะ พรัหมะจะริยัญจะ อะริยะสัจจานะ ทัสสะนัง นิพพานะสัจฉิกิริยา จะ เอตัมมังคะละมุตตะมัง","ผุฏฐัสสะ โลกะธัมเมหิ จิตตัง ยัสสะ นะ กัมปะติ อะโสกัง วิระชัง เขมัง เอตัมมังคะละมุตตะมัง","เอตาทิสานิ กัตวานะ สัพพัตถะมะปะราชิตา สัพพัตถะ โสตถิง คัจฉันติ ตันเตสัง มังคะละมุตตะมันติ"],"translation":"เทวดาและมนุษย์จำนวนมากปรารถนาความสวัสดี จึงทูลถามถึงมงคลสูงสุด พระพุทธเจ้าทรงแสดงว่า มงคลคือการไม่คบคนพาล คบบัณฑิต บูชาผู้ควรบูชา อยู่ในถิ่นเหมาะสม ทำบุญไว้ก่อน ตั้งตนไว้ชอบ มีความรู้และทักษะ วาจาสุภาษิต บำรุงบิดามารดา สงเคราะห์ครอบครัว ทำงานไม่คั่งค้าง ให้ทาน ประพฤติธรรม สงเคราะห์ญาติ ทำงานไม่มีโทษ งดเว้นบาปและของมึนเมา ไม่ประมาท เคารพ ถ่อมตน สันโดษ กตัญญู อดทน ว่าง่าย สนทนาธรรมตามกาล เพียรเผากิเลส ประพฤติพรหมจรรย์ เห็นอริยสัจ และทำพระนิพพานให้แจ้ง จิตไม่หวั่นไหวเมื่อโลกธรรมมากระทบ นี่คือมงคลสูงสุด","sourceUrl":"https://84000.org/pray/mangala-sutta.html","why":"หลักมงคลชีวิตจากพระสูตร ไม่ใช่เครื่องรางหรือฤกษ์ยาม"},{"id":"ratana-sutta","title":"รัตนสูตร (รัตนปริตร)","group":"พระสูตร / ปริตร","minutes":12,"level":"ยาว","pali":["ยานีธะ ภูตานิ สะมาคะตานิ ภุมมานิ วา ยานิวะ อันตะลิกเข สัพเพวะ ภูตา สุมะนา ภะวันตุ อะโถปิ สักกัจจะ สุณันตุ ภาสิตัง","ตัสมา หิ ภูตา นิสาเมถะ สัพเพ เมตตัง กะโรถะ มานุสิยา ปะชายะ ทิวา จะ รัตโต จะ หะรันติ เย พะลิง ตัสมา หิ เน รักขะถะ อัปปะมัตตา","ยังกิญจิ วิตตัง อิธะ วา หุรัง วา สัคเคสุ วา ยัง ระตะนัง ปะณีตัง นะ โน สะมัง อัตถิ ตะถาคะเตนะ อิทัมปิ พุทเธ ระตะนัง ปะณีตัง เอเตนะ สัจเจนะ สุวัตถิ โหตุ","ขะยัง วิราคัง อะมะตัง ปะณีตัง ยะทัชฌะคา สักยะมุนี สะมาหิโต นะ เตนะ ธัมเมนะ สะมัตถิ กิญจิ อิทัมปิ ธัมเม ระตะนัง ปะณีตัง เอเตนะ สัจเจนะ สุวัตถิ โหตุ","ยัมพุทธะเสฏโฐ ปะริวัณณะยี สุจิง สะมาธิมานันตะริกัญญะมาหุ สะมาธินา เตนะ สะโม นะ วิชชะติ อิทัมปิ ธัมเม ระตะนัง ปะณีตัง เอเตนะ สัจเจนะ สุวัตถิ โหตุ","เย ปุคคะลา อัฏฐะ สะตัง ปะสัฏฐา จัตตาริ เอตานิ ยุคานิ โหนติ เต ทักขิเณยยา สุคะตัสสะ สาวะกา เอเตสุ ทินนานิ มะหัปผะลานิ อิทัมปิ สังเฆ ระตะนัง ปะณีตัง เอเตนะ สัจเจนะ สุวัตถิ โหตุ","เย สุปปะยุตตา มะนะสา ทัฬเหนะ นิกกามิโน โคตะมะสาสะนัมหิ เต ปัตติปัตตา อะมะตัง วิคัยหะ ลัทธา มุธา นิพพุติง ภุญชะมานา อิทัมปิ สังเฆ ระตะนัง ปะณีตัง เอเตนะ สัจเจนะ สุวัตถิ โหตุ","ยะถินทะขีโล ปะถะวิสสิโต สิยา จะตุพภิ วาเตหิ อะสัมปะกัมปิโย ตะถูปะมัง สัปปุริสัง วะทามิ โย อะริยะสัจจานิ อะเวจจะ ปัสสะติ อิทัมปิ สังเฆ ระตะนัง ปะณีตัง เอเตนะ สัจเจนะ สุวัตถิ โหตุ","เย อะริยะสัจจานิ วิภาวะยันติ คัมภีระปัญเญนะ สุเทสิตานิ กิญจาปิ เต โหนติ ภุสัปปะมัตตา นะ เต ภะวัง อัฏฐะมะมาทิยันติ อิทัมปิ สังเฆ ระตะนัง ปะณีตัง เอเตนะ สัจเจนะ สุวัตถิ โหตุ","สะหาวัสสะ ทัสสะนะสัมปะทายะ ตะยัสสุ ธัมมา ชะหิตา ภะวันติ สักกายะทิฏฐิ วิจิกิจฉิตัญจะ สีลัพพะตัง วาปิ ยะทัตถิ กิญจิ จะตูหะปาเยหิ จะ วิปปะมุตโต ฉะ จาภิฐานานิ อะภัพโพ กาตุง อิทัมปิ สังเฆ ระตะนัง ปะณีตัง เอเตนะ สัจเจนะ สุวัตถิ โหตุ","กิญจาปิ โส กัมมัง กะโรติ ปาปะกัง กาเยนะ วาจา อุทะ เจตะสา วา อะภัพโพ โส ตัสสะ ปะฏิจฉะทายะ อะภัพพะตา ทิฏฐะปะทัสสะ วุตตา อิทัมปิ สังเฆ ระตะนัง ปะณีตัง เอเตนะ สัจเจนะ สุวัตถิ โหตุ","วะนัปปะคุมเพ ยะถา ผุสสิตัคเค คิมหานะมาเส ปะฐะมัสมิง คิมเห ตะถูปะมัง ธัมมะวะรัง อะเทสะยิ นิพพานะคามิง ปะระมัง หิตายะ อิทัมปิ พุทเธ ระตะนัง ปะณีตัง เอเตนะ สัจเจนะ สุวัตถิ โหตุ","วะโร วะรัญญู วะระโท วะราหะโร อะนุตตะโร ธัมมะวะรัง อะเทสะยิ อิทัมปิ พุทเธ ระตะนัง ปะณีตัง เอเตนะ สัจเจนะ สุวัตถิ โหตุ","ขีณัง ปุราณัง นะวัง นัตถิ สัมภะวัง วิรัตตะจิตตายะติเก ภะวัสมิง เต ขีณะพีชา อะวิรุฬหิฉันทา นิพพันติ ธีรา ยะถายัมปะทีโป อิทัมปิ สังเฆ ระตะนัง ปะณีตัง เอเตนะ สัจเจนะ สุวัตถิ โหตุ","ยานีธะ ภูตานิ สะมาคะตานิ ภุมมานิ วา ยานิวะ อันตะลิกเข ตะถาคะตัง เทวะมะนุสสะปูชิตัง พุทธัง นะมัสสามะ สุวัตถิ โหตุ","ยานีธะ ภูตานิ สะมาคะตานิ ภุมมานิ วา ยานิวะ อันตะลิกเข ตะถาคะตัง เทวะมะนุสสะปูชิตัง ธัมมัง นะมัสสามะ สุวัตถิ โหตุ","ยานีธะ ภูตานิ สะมาคะตานิ ภุมมานิ วา ยานิวะ อันตะลิกเข ตะถาคะตัง เทวะมะนุสสะปูชิตัง สังฆัง นะมัสสามะ สุวัตถิ โหตุ"],"translation":"หมู่ภูตทั้งหลายที่มาประชุมกันทั้งบนพื้นดินและในอากาศ ขอจงมีใจดีและตั้งใจฟัง ขอให้มีเมตตาต่อมนุษย์และรักษากันด้วยความไม่ประมาท พระพุทธ พระธรรม และพระสงฆ์เป็นรัตนะอันประเสริฐ ไม่มีสิ่งใดเสมอด้วยคุณแห่งพระรัตนตรัย ด้วยสัจวาจานี้ ขอความสวัสดีจงมี บทนี้กล่าวถึงคุณพระรัตนตรัย ความมั่นคงของผู้เห็นอริยสัจ และการดำเนินไปสู่ความสิ้นทุกข์ ตอนท้ายเป็นการนอบน้อมพระพุทธ พระธรรม และพระสงฆ์","sourceUrl":"https://84000.org/pray/ratana-sutta.html","why":"พระปริตรสรรเสริญคุณพระรัตนตรัย"},{"id":"pattidana","title":"คำแผ่ส่วนกุศล (อุทิศบุญ)","group":"เมตตา","minutes":4,"level":"ง่าย","pali":["อิทัง เม มาตาปิตูนัง โหตุ สุขิตา โหนตุ มาตาปิตะโร","อิทัง เม ญาตีนัง โหตุ สุขิตา โหนตุ ญาตะโย","อิทัง เม คุรูปัชฌายาจริยานัง โหตุ สุขิตา โหนตุ คุรูปัชฌายาจริยา","อิทัง สัพพะเทวะตานัง โหตุ สุขิตา โหนตุ สัพเพ เทวา","อิทัง สัพพะเปตานัง โหตุ สุขิตา โหนตุ สัพเพ เปตา","อิทัง สัพพะเวรีนัง โหตุ สุขิตา โหนตุ สัพเพ เวรี","อิทัง สัพพะสัตตานัง โหตุ สุขิตา โหนตุ สัพเพ สัตตา"],"translation":"ขอส่วนบุญนี้จงสำเร็จแก่มารดาบิดา ญาติ ครูอุปัชฌาย์อาจารย์ เทวดา เปรต เจ้ากรรมนายเวร และสัตว์ทั้งหลายทั้งปวง ขอให้ทุกท่านมีความสุข","sourceUrl":"https://84000.org/pray/pattidana.html","why":"แผ่ส่วนกุศลหลังสวดมนต์หรือทำบุญ"},{"id":"abhinha","title":"อภิณหปัจจเวกขณปาฐะ (พิจารณาธรรม ๕ ประการ)","group":"พิจารณาธรรม","minutes":5,"level":"ง่าย","pali":["ชะราธัมโมมหิ ชะรัง อะนะตีโต","พยาธิธัมโมมหิ พยาธิง อะนะตีโต","มะระณะธัมโมมหิ มะระณัง อะนะตีโต","สัพเพหิ เม ปิเยหิ มะนาเปหิ นานาภาโว วินาภาโว","กัมมัสสะโกมหิ กัมมะทายาโท กัมมะโยนิ กัมมะพันธุ กัมมะปะฏิสะระโณ ยัง กัมมัง กะริสสามิ กัลยาณัง วา ปาปะกัง วา ตัสสะ ทายาโท ภะวิสสามิ"],"translation":"เรามีความแก่เป็นธรรมดา จะล่วงพ้นความแก่ไปไม่ได้; เรามีความเจ็บไข้เป็นธรรมดา จะล่วงพ้นความเจ็บไข้ไปไม่ได้; เรามีความตายเป็นธรรมดา จะล่วงพ้นความตายไปไม่ได้; เราจะต้องพลัดพรากจากของรักของชอบใจทั้งหลายทั้งปวง; เรามีกรรมเป็นของตน เป็นผู้รับผลของกรรม มีกรรมเป็นแดนเกิด มีกรรมเป็นเผ่าพันธุ์ มีกรรมเป็นที่พึ่งอาศัย เราทำกรรมอันใดไว้ เป็นกรรมดีก็ตาม กรรมชั่วก็ตาม จักเป็นผู้รับผลของกรรมนั้น","sourceUrl":"https://84000.org/pray/abhinha-paccavekkhana.html","why":"พิจารณาความจริงของชีวิตเพื่อความไม่ประมาท"}];
